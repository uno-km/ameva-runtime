[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ameva-runtime"
dynamic = ["version"]
description = "Unified Next-Gen Hardware Orchestration & AI Acceleration Runtime for Mobile & Edge"

readme = "README.pypi.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Eunho Kim", email = "contact@uno-km.com" }]
keywords = [
  "vulkan-compute",
  "mobile-gpu",
  "hardware-acceleration",
  "hardware-abstraction-layer",
  "adreno-gpu",
  "arm-mali",
  "snapdragon-8-elite",
  "exynos",
  "termux",
  "on-device-ai",
  "edge-ai",
  "tensor-acceleration",
  "spir-v",
  "compute-shaders",
  "zero-silent-fallback",
  "llamacpp",
  "whisper-cpp",
  "sherpa-onnx",
  "stable-diffusion",
  "vision-language-models",
  "bitnet",
  "gguf",
  "ncnn",
  "bionic-loader",
  "arm64",
  "aarch64",
  "cgroup-management",
  "cpu-neon",
  "thermal-throttling",
  "power-efficiency",
  "smart-router",
  "hardware-orchestration",
  "multi-modal-ai",
  "subgroup-operations",
  "gemm-acceleration",
  "mobile-vlm",
  "speech-to-text",
  "text-to-speech",
  "image-generation",
  "edge-inference",
  "unprivileged-userspace",
  "termux-wake-lock",
  "phantom-process-killer",
  "android-ai-runtime",
  "valhall-gpu",
  "adreno-830",
  "mali-g68",
  "ameva-foundation",
  "uno-km",
  "open-source-ai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
ameva = "ameva_runtime.cli:main"
ameva-run = "ameva_runtime.cli:main"
ameva-gpu = "ameva_runtime.cli:legacy_gpu_main"
ameva-doctor = "ameva_runtime.cli:main"
ameva-vulkan = "ameva_runtime.cli:main"

[project.urls]
Homepage = "https://uno-km.vercel.app/lib/vulkan/"
Repository = "https://github.com/uno-km/ameva-runtime"
Documentation = "https://uno-km.vercel.app/lib/vulkan/"

[project.optional-dependencies]
stt       = ["termux-stt>=1.2.0"]
diffusion = ["termux-diffusion>=1.5.0"]
bitnet    = ["termux-bitnet>=1.2.0"]
llamacpp  = ["termux-llamacpp>=1.3.0"]
tts       = ["termux-tts>=1.4.0"]
vision    = ["termux-vision>=1.2.0"]
all = [
    "termux-stt>=1.2.0",
    "termux-diffusion>=1.5.0",
    "termux-bitnet>=1.2.0",
    "termux-llamacpp>=1.3.0",
    "termux-tts>=1.4.0",
    "termux-vision>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["ameva_runtime*"]
exclude = ["tests*", "*tests*"]

[tool.setuptools.dynamic]
version = {attr = "ameva_runtime._version.__version__"}




[tool.setuptools.package-data]
"ameva_runtime" = [
    "py.typed",
]
"ameva_runtime.vulkan" = [
    "profiles/*.json",
    "lib/*.so",
    "lib/*.dll",
    "py.typed",
]
