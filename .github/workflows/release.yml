name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if PyPI project exists
        id: check-py
        run: |
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check-py.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        if: steps.check-py.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        if: steps.check-py.outputs.has_python == 'true'
        run: python -m build

      - name: Verify distribution archives
        if: steps.check-py.outputs.has_python == 'true'
        run: twine check dist/*

      - name: Publish to PyPI
        if: steps.check-py.outputs.has_python == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --skip-existing dist/*

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish NPM package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -f "package.json" ]; then
            PKG_NAME=$(node -p "require('./package.json').name")
            PKG_VER=$(node -p "require('./package.json').version")
            if [ "$(npm view ${PKG_NAME}@${PKG_VER} version 2>/dev/null)" = "${PKG_VER}" ]; then
              echo "Version ${PKG_VER} of ${PKG_NAME} is already published on NPM. Skipping."
            else
              echo "Publishing ${PKG_NAME}@${PKG_VER} to NPM..."
              npm publish --access public
            fi
          elif [ -f "npm/package.json" ]; then
            cd npm
            PKG_NAME=$(node -p "require('./package.json').name")
            PKG_VER=$(node -p "require('./package.json').version")
            if [ "$(npm view ${PKG_NAME}@${PKG_VER} version 2>/dev/null)" = "${PKG_VER}" ]; then
              echo "Version ${PKG_VER} of ${PKG_NAME} is already published on NPM. Skipping."
            else
              echo "Publishing ${PKG_NAME}@${PKG_VER} to NPM..."
              npm publish --access public
            fi
          else
            echo "No package.json found. Skipping NPM publish."
          fi

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@uno-km'

      - name: Publish to GitHub Packages
        run: |
          cd npm
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@uno-km/ameva-runtime';
            pkg.repository = {
              type: 'git',
              url: 'git+https://github.com/uno-km/ameva-runtime.git'
            };
            pkg.publishConfig = {
              registry: 'https://npm.pkg.github.com'
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish || echo "Package @uno-km/ameva-runtime already published to GitHub Packages. Skipping."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-release:
    name: Verify Native Assets & Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-npm, publish-github-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Automated Artifact Verification & Cryptographic Manifest Generation
        run: |
          mkdir -p dist/assets
          if [ -f "tools/build_release_manifest.py" ] && ls dist/assets/*.tar.gz 1> /dev/null 2>&1; then
            python tools/build_release_manifest.py \
              --assets-dir dist/assets \
              --tag "${{ github.ref_name }}"
          else
            echo "No native assets found or tools script omitted; proceeding with package distributions."
          fi

      - name: Strict Pre-Release Cryptographic Check
        run: |
          if [ -f "dist/assets/release-manifest.json" ]; then
            echo "[*] Verifying all assets match generated manifest..."
            for asset in dist/assets/*.tar.gz; do
              [ -f "$asset" ] || continue
              ACTUAL_SHA=$(sha256sum "$asset" | awk '{print $1}')
              FILENAME=$(basename "$asset")
              MANIFEST_SHA=$(python -c "import json; print(json.load(open('dist/assets/release-manifest.json'))['assets']['$FILENAME']['sha256'])")
              if [ "$ACTUAL_SHA" != "$MANIFEST_SHA" ]; then
                echo "FATAL: Cryptographic mismatch for $FILENAME: actual=$ACTUAL_SHA, manifest=$MANIFEST_SHA"
                exit 1
              fi
              echo "[PASS] Verified $FILENAME: $ACTUAL_SHA"
            done
          fi

      - name: Create GitHub Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          RELEASE_FILES=(dist/*.whl dist/*.tar.gz dist/assets/*)
          echo "Publishing release ${{ github.ref_name }} with ${#RELEASE_FILES[@]} assets..."
          gh release create "${{ github.ref_name }}" "${RELEASE_FILES[@]}" \
            --title "AMEVA Runtime ${{ github.ref_name }}" \
            --generate-notes


