code_example_py: |
  import ameva_runtime as ameva

  # 1. Execute LLM inference directly with optimal on-device hardware dispatch
  result = ameva.run(
      model="qwen2.5-0.5b",
      prompt="Space in Korean is:",
      max_tokens=32
  )

  print(f"Generated text: {result.text}")
  print(f"Hardware backend: {result.backend_used} ({result.tokens_per_second:.2f} t/s)")

  # 2. Preview hardware execution plan
  plan = ameva.plan(model="qwen2.5-0.5b")
  print(f"Route: {plan.backend} | NGL: {plan.ngl} | Threads: {plan.threads}")
code_example_js: |
  import { createContext, Doctor } from "@ameva/runtime";

  const doctor = new Doctor();
  const report = await doctor.runSelfTest();
  console.log(`Topology Status: ${report.overallSuccess}, Hardware: ${report.deviceName}`);

  const ctx = await createContext({ device: "auto" });
  console.log(`Runtime Context Initialized on ${ctx.deviceName}`);
changelog:
- version: "v1.0.0"
  date: '2026-09-04'
  title: Unified Production Release with Real Adreno & Mali Empirical Benchmarks
  type: Official Production Release
  changes:
  - 'Empirical Snapdragon 8 Elite (Adreno 830) Validation: Verified 25/25 layer full VRAM offload achieving 35.80 tokens/sec (27.93 ms/t), demonstrating a 35.8x acceleration over pure CPU.'
  - 'ARM Mali Headless Fence Deadlock Prevention: Isolated proprietary Mali Vulkan driver bug (vkWaitForFences hang on headless CLI without SurfaceFlinger swapchains) and implemented automated Cortex-A78 CPU-NEON fallback routing (3.55 tokens/sec).'
  - 'Unified AmevaRuntime Python Execution Engine: Added ameva.run() and ameva.execute() top-level APIs with automatic dynamic library resolution and latency telemetry parsing.'
  - 'Universal Command-Line Interface: Provided unified ameva-run CLI with doctor, profile, plan, exec, and benchmark commands.'
  - 'Zero-Breaking Backward Compatibility: Seamlessly maintained legacy ameva_vulkan_runtime module and VulkanContext interfaces.'
- version: "v1.2.1"
  date: '2026-09-02'
  title: Hardened Fail-Fast & Complete 12-Stage Diagnostic Suite
  type: Maintenance Release
  changes:
  - 'Real GPU Pipeline Verification: Integrated C ABI FFI SGEMM kernel dispatch and numeric checksum ($c[0,0]=32.0$) across Doctor stages V7~V11.'
  - 'RAII Lifecycle Adapter Cleanup: Automated unbind_all() across 6 modality adapters on context exit preventing resource and handle leaks.'
  - 'Exynos 2100 RTLD_LAZY Isolation: Resolved Bionic GLESv3 symbol linking failure on Samsung One UI devices.'
- version: "v1.1.0"
  date: '2026-09-01'
  title: Galaxy A35 Validation & CTypes Pointer Patch
  type: Maintenance Release
  changes:
  - 'Real-Device Galaxy A35 Validation: Certified 12-stage hardware diagnostic hierarchy on Samsung Galaxy A35 5G.'
  - 'Dynamic Topology Thread Optimization: Added CPU topology inspection targeting big-core clusters.'

