# doc.config.yaml - AMEVA-Vulkan-Runtime Single Source of Truth
name: "AMEVA-Vulkan-Runtime"
package_name_pypi: "ameva-vulkan-runtime"
package_name_npm: "ameva-vulkan-runtime"
version: "v1.0.0"
release_name: "Unified Multi-Modal Acceleration Release"
license: "Apache-2.0"
platform: "Android ARM64 / Snapdragon & Mali & Xclipse"
github_repo_url: "https://github.com/uno-km/ameva-vulkan-runtime"

tagline_en: "Unified Cross-Modal Vulkan GPU Acceleration Runtime & HAL for Mobile Android"
tagline_ko: "안드로이드 모바일 환경을 위한 통합 크로스 모달 Vulkan GPU 가속 런타임 및 하드웨어 추상화 계층(HAL)"

quick_install_cmd: "pip install ameva-vulkan-runtime\n# or: npm install ameva-vulkan-runtime"

why_challenge_en: "Running multi-modal AI on mobile Android is plagued by fragmented GPU drivers, loader crashes between Bionic and Mesa, tensor alignment buffer overflows, and redundant binary bloat across individual packages."
why_challenge_ko: "안드로이드 환경에서 멀티모달 AI를 구동할 때 벤더별 GPU 드라이버 결함, Bionic과 Mesa 간 로더 충돌(SIGABRT), 텐서 정렬 미비로 인한 메모리 침범(OOB), 그리고 각 패키지별 중복 바이너리 비대화가 심각한 난제로 작용합니다."

description_en: "Provides a single, zero-hardcoded C++20 Vulkan Hardware Abstraction Layer (HAL) and universal runtime for STT, Vision, LLM, Diffusion, and Training with a granular 12-stage validation hierarchy (V0-V11) and zero-data-loss auto-recovery."
description_ko: "단일 C++20 Vulkan 하드웨어 추상화 계층(HAL)과 통합 런타임을 통해 STT, 비전, LLM, 디퓨전, 트레이닝 전 모달리티를 가속하며, 12단계 정밀 자체 검증(V0~V11)과 무손실 자동 복구 체계를 제공합니다."

features:
  - title_en: "Single Loader Chain Pinning"
    title_ko: "시스템 ICD 단일 로더 체인 고정"
    desc_en: "Eliminates Termux Mesa vs Android Bionic symbol collisions via dynamic dladdr provenance and sys_gpdf2 isolation."
    desc_ko: "동적 dladdr 텔레메트리를 통해 시스템 순정 ICD 드라이버를 단일 체인으로 고정하여 Termux Mesa 충돌(SIGABRT)을 원천 차단합니다."
  - title_en: "12-Stage Probing & Fallback"
    title_ko: "12단계 정밀 자체 진단 및 무손실 복구"
    desc_en: "Validates GPU capability from dlopen (V0) to E2E model inference (V11) with transparent CPU NEON recovery."
    desc_ko: "dlopen 라이브러리 오픈(V0)부터 E2E 추론(V11)까지 12단계로 검증하며, 오류 시 투명한 CPU NEON 복구를 보장합니다."
  - title_en: "Multi-Modal Cross-Acceleration"
    title_ko: "전 모달리티 단일 런타임 공유"
    desc_en: "Powers Whisper STT, LLaVA Vision, LLaMA/BitNet LLM, and Stable Diffusion from a unified C++20 shared HAL core."
    desc_ko: "단일 C++20 통합 공유 HAL 코어로 Whisper 음성인식, LLaVA 비전, LLaMA/BitNet LLM, Stable Diffusion을 통합 가속합니다."

matrix_table:
  - category: "Supported GPUs"
    operations: "Qualcomm Adreno 830/700/600, ARM Mali-G78/G68/G77, Samsung Xclipse 950/920"
    status: "Production"
  - category: "Validation Hierarchy"
    operations: "V0 (Loader) ~ V11 (E2E Diffusion / Whisper / LLaMA Inference)"
    status: "Production"
  - category: "Zero-Drift Quirks Fixes"
    operations: "Adreno Subgroup Control Bypass, Mali 128-byte Strict Memory Alignment"
    status: "Production"

code_example_py: |
  import ameva_vulkan_runtime as avr

  # 1. Probe & Validate Hardware (V0-V11)
  doctor = avr.Doctor()
  report = doctor.run_self_test()
  print(f"GPU Backend Status: {report.status}, Device: {report.device_name}")

  # 2. Acquire High-Performance Vulkan Context for STT / LLM / Diffusion
  ctx = avr.create_context(device="auto", memory_limit_mb=1024)
  print(f"Context initialized via: {ctx.loader_path} (API {ctx.vulkan_version})")

code_example_js: |
  import { Doctor, createContext } from "ameva-vulkan-runtime";

  const doctor = new Doctor();
  const report = await doctor.runSelfTest();
  console.log(`GPU Status: ${report.status}, GPU: ${report.deviceName}`);

  const ctx = await createContext({ device: "auto" });
  console.log(`Vulkan Context Ready on ${ctx.deviceName}`);

